name: Fix product node cleaner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-product-node-cleaner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install test dependencies
        run: python -m pip install -q beautifulsoup4 requests

      - name: Apply generic BeautifulSoup safety fix and version bump
        run: |
          python - <<'PY'
          from pathlib import Path

          scraper = Path('catalog_scraper.py')
          text = scraper.read_text(encoding='utf-8')
          old = '''    for tag in list(clone.find_all(True)):\n        role = str(tag.get("role") or "").casefold()\n'''
          new = '''    for tag in list(clone.find_all(True)):\n        # Decomposing a parent invalidates descendant Tag.attrs in BeautifulSoup.\n        # The prebuilt list can still contain those descendants, so skip them safely.\n        if getattr(tag, "attrs", None) is None:\n            continue\n        role = str(tag.get("role") or "").casefold()\n'''
          if old not in text:
              raise SystemExit('Expected _clean_product_node_text loop not found')
          text = text.replace(old, new, 1)
          if 'CATALOG_PARSER_BUILD = "v0.4.2"' not in text:
              raise SystemExit('Expected parser build marker not found')
          text = text.replace('CATALOG_PARSER_BUILD = "v0.4.2"', 'CATALOG_PARSER_BUILD = "v0.4.3"', 1)
          scraper.write_text(text, encoding='utf-8')

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          replacements = [
              ('Pricing, comparable-market & AI-assisted data intake · v0.4.5',
               'Pricing, comparable-market & AI-assisted data intake · v0.4.6'),
              ('Start with a known comparable or enter a new/unreleased wine. v0.4.5 keeps',
               'Start with a known comparable or enter a new/unreleased wine. v0.4.6 keeps'),
              ('### v0.4.5 approach', '### v0.4.6 approach'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected app version text not found: {old!r}')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and targeted regression check
        run: |
          python -m py_compile app.py catalog_scraper.py
          python - <<'PY'
          from bs4 import BeautifulSoup
          import catalog_scraper as cs

          html = '''
          <section class="product-detail">
            <h1>2023 Test Syrah</h1>
            <div class="related-products"><span><em>Related wine shell</em></span></div>
            <div class="product-copy">Estate Syrah $55.00</div>
          </section>
          '''
          soup = BeautifulSoup(html, 'html.parser')
          text = cs._clean_product_node_text(soup.find('section'))
          assert 'Estate Syrah' in text
          assert 'Related wine shell' not in text
          PY

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py catalog_scraper.py
          git commit -m 'Harden product node cleaning for nested decomposed tags'
          git push origin main