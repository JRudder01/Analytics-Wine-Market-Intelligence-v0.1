name: Raise catalog batch limit to 30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raise-catalog-batch-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Raise selected product-page batch limit
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          replacements = {
              'robots.txt checked · 12-page batch limit · 2 MB/page cap':
                  'robots.txt checked · 30-page batch limit · 2 MB/page cap',
              'maximum 12 per batch': 'maximum 30 per batch',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected app.py text not found: {old!r}')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          scraper = Path('catalog_scraper.py')
          text = scraper.read_text(encoding='utf-8')
          old = 'max_pages: int = 12,'
          new = 'max_pages: int = 30,'
          if old not in text:
              raise SystemExit(f'Expected catalog_scraper.py text not found: {old!r}')
          text = text.replace(old, new, 1)
          scraper.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile app.py catalog_scraper.py

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py catalog_scraper.py
          git commit -m 'Raise catalog product scan batch limit to 30'
          git push origin main
