name: Refresh wine public data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 2"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_public_data.py
      - name: Commit refreshed public data
        run: |
          git config user.name "rudder-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public_context.csv data/raw/ || true
          if git diff --cached --quiet; then
            echo "No public-data changes to commit."
          else
            git commit -m "Refresh public wine market data"
            git push
          fi
